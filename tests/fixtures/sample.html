<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Fallback Title Element</title>
    <meta name="description" content="Fallback meta description.">

    <meta property="og:title" content="The OpenGraph Title">
    <meta property="og:description" content="An OpenGraph description of the page.">
    <meta property="og:image" content="/images/cover.jpg">
    <meta property="og:site_name" content="Example News">
    <meta property="og:type" content="article">
    <meta property="article:published_time" content="2026-01-15T09:30:00Z">
    <meta property="article:modified_time" content="2026-01-16T12:00:00Z">
    <meta property="article:author" content="Jane Author">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The Twitter Title">
    <meta name="twitter:creator" content="@janeauthor">
    <meta name="twitter:site" content="@examplenews">
</head>
<body>
    <h1>Hello, world</h1>
</body>
</html>
